name: Auto Update Google, YouTube & Spotify Hosts

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动更新
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  update-hosts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Combine Google & Spotify Hosts
        run: |
          echo "# Automatically Generated Hosts for Google, YouTube & Spotify" > hosts_new
          echo "# Updated at: $(date -u)" >> hosts_new
          echo "" >> hosts_new

          # 1. 获取 Google & YouTube 最新的有效 Hosts 源
          echo "# --- Google & YouTube Hosts ---" >> hosts_new
          curl -s https://raw.githubusercontent.com/521meme/hosts/main/hosts | grep -E "google|youtube|ytimg|ggpht|googlevideo|gstatic" >> hosts_new || true
          echo "" >> hosts_new

          # 2. 获取 Spotify 最新的有效 Hosts 源
          echo "# --- Spotify Hosts ---" >> hosts_new
          curl -s https://raw.githubusercontent.com/521meme/hosts/main/hosts | grep -E "spotify" >> hosts_new || true

          # 替换覆盖主 hosts 文件
          mv hosts_new hosts

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add hosts
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: auto update Google, YouTube & Spotify Hosts"
            git push
          fi
